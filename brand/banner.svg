<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1526"/><stop offset="1" stop-color="#0A0F1C"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121D33"/><stop offset="1" stop-color="#0B1120"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5"><stop offset="0" stop-color="#22C55E" stop-opacity="0.16"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- left: lockup -->
  <g transform="translate(96 150) scale(0.1875)">
    <rect width="512" height="512" rx="112" fill="url(#tile)"/>
    <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#2A3B55" stroke-width="3"/>
    <rect x="96" y="392" width="320" height="10" rx="5" fill="#334155"/>
    <rect x="150" y="150" width="56" height="256" rx="14" fill="#F8FAFC"/>
    <g transform="translate(206 178) rotate(-24)">
      <rect x="-16" y="-20" width="226" height="40" rx="20" fill="#22C55E"/>
      <rect x="52" y="-20" width="34" height="40" fill="#0B1120" opacity="0.9"/>
      <rect x="120" y="-20" width="34" height="40" fill="#0B1120" opacity="0.9"/>
    </g>
    <circle cx="206" cy="178" r="22" fill="#0B1120" stroke="#F8FAFC" stroke-width="10"/>
  </g>
  <text x="216" y="218" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="650" letter-spacing="-2" fill="#F8FAFC">Tollbooth</text>

  <text x="96" y="318" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.5" fill="#F8FAFC">Escrow for software</text>
  <text x="96" y="372" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.5" fill="#F8FAFC">that pays software.</text>
  <text x="96" y="424" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8">Role-based USDC escrow on Arc. Milestones, evidence, approvals, disputes.</text>
  <text x="96" y="452" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8">A TypeScript SDK and tool set so agents can hire, deliver and get paid.</text>

  <!-- pills -->
  <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="96" y="492" width="200" height="36" rx="8" fill="#0F172A" stroke="#273449"/><text x="116" y="515" fill="#CBD5E1">npm i tollbooth-sdk</text>
    <rect x="324" y="492" width="118" height="36" rx="8" fill="#0F172A" stroke="#273449"/><text x="344" y="515" fill="#22C55E">USDC · Arc</text>
    <rect x="456" y="492" width="214" height="36" rx="8" fill="#0F172A" stroke="#273449"/><text x="476" y="515" fill="#CBD5E1">Built with Arc Studio</text>
  </g>

  <!-- right: flow schematic -->
  <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect x="780" y="170" width="150" height="56" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="855" y="194" text-anchor="middle" fill="#F8FAFC" font-weight="600">Agent A</text>
    <text x="855" y="214" text-anchor="middle" fill="#64748B">client</text>

    <rect x="1010" y="170" width="150" height="56" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="1085" y="194" text-anchor="middle" fill="#F8FAFC" font-weight="600">Agent B</text>
    <text x="1085" y="214" text-anchor="middle" fill="#64748B">worker</text>

    <rect x="895" y="300" width="150" height="56" rx="10" fill="#0B1120" stroke="#22C55E"/>
    <text x="970" y="324" text-anchor="middle" fill="#22C55E" font-weight="600">Tollbooth</text>
    <text x="970" y="344" text-anchor="middle" fill="#64748B">USDC held</text>

    <rect x="895" y="430" width="150" height="56" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="970" y="454" text-anchor="middle" fill="#F8FAFC" font-weight="600">Resolver</text>
    <text x="970" y="474" text-anchor="middle" fill="#64748B">disputes</text>

    <!-- A -> Tollbooth: hire, fund -->
    <path d="M870 226 L945 298" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="846" y="276" text-anchor="end" fill="#94A3B8">hire · fund</text>
    <!-- Tollbooth -> B: release -->
    <path d="M1015 298 L1072 236" stroke="#22C55E" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="1096" y="276" fill="#22C55E">release</text>
    <!-- B -> Tollbooth: evidence -->
    <path d="M1096 226 L1040 290" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <text x="1122" y="246" fill="#94A3B8">evidence</text>
    <!-- Tollbooth <-> Resolver -->
    <path d="M970 356 L970 428" stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <text x="984" y="398" fill="#F59E0B">dispute → resolve</text>
  </g>
</svg>
