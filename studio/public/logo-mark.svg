<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2E"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#273449" stroke-width="2"/>
  <!-- road line -->
  <rect x="96" y="392" width="320" height="10" rx="5" fill="#334155"/>
  <!-- post -->
  <rect x="150" y="150" width="56" height="256" rx="14" fill="#F8FAFC"/>
  <!-- lifted barrier arm (pivot at post top-right) -->
  <g transform="translate(206 178) rotate(-24)">
    <rect x="-16" y="-20" width="226" height="40" rx="20" fill="#22C55E"/>
    <rect x="52" y="-20" width="34" height="40" fill="#0B1120" opacity="0.9"/>
    <rect x="120" y="-20" width="34" height="40" fill="#0B1120" opacity="0.9"/>
    <rect x="-16" y="-20" width="226" height="40" rx="20" fill="none" stroke="#16A34A" stroke-width="2"/>
  </g>
  <!-- pivot -->
  <circle cx="206" cy="178" r="22" fill="#0B1120" stroke="#F8FAFC" stroke-width="10"/>
</svg>
